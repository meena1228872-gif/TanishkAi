name: Build TanishkAI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "TanishkAI_Clean_Project.zip"
      - ".github/workflows/build-apk-from-zip.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract TanishkAI project ZIP
        shell: bash
        run: |
          set -e
          unzip -q TanishkAI_Clean_Project.zip -d extracted
          PROJECT_DIR="extracted/TanishkAI"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: TanishkAI project was not found inside the ZIP."
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Create local.properties
        shell: bash
        run: |
          printf 'GEMINI_API_KEY=%s\n' '${{ secrets.GEMINI_API_KEY }}' > "$PROJECT_DIR/local.properties"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TanishkAI-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
